{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-dark border-secondary" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">

            <!-- LOGO -->
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="MarketSync Logo" style="height: 64px; width: auto;">
                <h3 class="fw-bold text-white mt-3 mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to your MarketSync account</p>
            </div>

            <!-- FORM -->
            <form id="login_form" action="{{ url_for('login') }}" method="POST">
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <div class="mb-3">
                    <label for="login_input" class="form-label text-muted small text-uppercase">Email or Username</label>
                    <input type="text" id="login_input" name="email"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="you@example.com or username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="login_password" class="form-label text-muted small text-uppercase">Password</label>
                    <input type="password" id="login_password" name="password"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="••••••••" required>
                </div>
                <button type="submit" id="login_btn" class="btn btn-success w-100 fw-bold py-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Login
                </button>
            </form>

            <hr class="border-secondary my-4">

            <p class="text-center text-muted small mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-success fw-semibold">
                    Register here
                </a>
            </p>

            <div id="iframe_notice" class="mt-3 text-center d-none">
                <a href="{{ url_for('login') }}" target="_blank" rel="noopener noreferrer"
                   class="badge bg-secondary bg-opacity-50 text-decoration-none text-light p-2">
                    <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Open login in new tab
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    if (window.self !== window.top) {
        document.getElementById('iframe_notice')?.classList.remove('d-none');
    }
</script>

{% endblock %}
